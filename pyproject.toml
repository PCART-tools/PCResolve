[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pcresolve"
version = "1.0.8"
description = "Project-level Python static analysis for API ownership and library usage provenance"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=7", "mypy>=1.11,<2", "psutil>=5.9"]

[project.urls]
Homepage = "https://github.com/PCART-tools/PCResolve"
Repository = "https://github.com/PCART-tools/PCResolve"
Issues = "https://github.com/PCART-tools/PCResolve/issues"

[project.scripts]
pcresolve = "pcresolve.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
include = ["pcresolve", "pcresolve.*"]
namespaces = false

[tool.pytest.ini_options]
norecursedirs = ["tests/fixtures/tested_projects"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src/pcresolve/flow/contracts.py", "tests/typecheck_flow_contracts.py"]
